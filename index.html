<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Lucky Run 3D</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-shell">
    <header>
      <h1>Lucky Run 3D</h1>
      <p class="subtitle">Проведи фігуру по треку, міняй смуги та збирай монети.</p>
    </header>

    <main>
      <canvas id="gameCanvas" width="360" height="640"></canvas>
      <div class="hud">
        <div>Рахунок: <span id="score">0</span></div>
        <div>Монети: <span id="coins">0</span></div>
      </div>
      <div id="bannerAd" class="banner-ad">Банерна реклама</div>
    </main>

    <div class="overlay hidden" id="gameOverPanel">
      <div class="panel">
        <h2>Гра закінчена</h2>
        <p>Отримано: <span id="finalScore">0</span></p>
        <button id="restartBtn">Грати ще</button>
        <button id="watchAdBtn">Подивитися рекламу і продовжити</button>
      </div>
    </div>

    <footer>
      <p>Прототип 3D-платформи. Заміни місця для реклами на реальні SDK.</p>
    </footer>
  </div>

  <script src="three.min.js"></script>
  <script>
    if (typeof THREE === 'undefined') {
      const errorBox = document.createElement('div');
      errorBox.style.position = 'fixed';
      errorBox.style.inset = '0';
      errorBox.style.display = 'grid';
      errorBox.style.placeItems = 'center';
      errorBox.style.background = 'rgba(15, 23, 42, 0.96)';
      errorBox.style.color = '#f8fafc';
      errorBox.style.padding = '24px';
      errorBox.style.fontSize = '1.05rem';
      errorBox.style.textAlign = 'center';
      errorBox.style.zIndex = '9999';
      errorBox.textContent = 'Не вдалося завантажити Three.js. Перевір, чи файл three.min.js існує поруч з index.html.';
      document.body.appendChild(errorBox);
    }
  </script>
  <script src="script.js"></script>
</body>
</html>
