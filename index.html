<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Lucky Jump</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-shell">
    <header>
      <h1>Lucky Jump</h1>
      <p class="subtitle">Торкнись, щоб стрибнути. Збирай монети і дивись рекламу за продовження.</p>
    </header>

    <main>
      <canvas id="gameCanvas" width="360" height="640"></canvas>
      <div class="hud">
        <div>Счет: <span id="score">0</span></div>
        <div>Монети: <span id="coins">0</span></div>
      </div>
      <div id="bannerAd" class="banner-ad">Банерна реклама</div>
    </main>

    <div class="overlay hidden" id="gameOverPanel">
      <div class="panel">
        <h2>Гра закінчена</h2>
        <p>Набрано: <span id="finalScore">0</span></p>
        <button id="restartBtn">Грати ще</button>
        <button id="watchAdBtn">Подивитися рекламу і продовжити</button>
      </div>
    </div>

    <footer>
      <p>Відкритий прототип. Замініть банер і відео на свої рекламні SDK.</p>
    </footer>
  </div>

  <script src="script.js"></script>
</body>
</html>
